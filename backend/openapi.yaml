openapi: 3.1.0
info:
  title: X-Panel Central API
  version: 0.1.0
  description: >-
    Central read model and operations API for multi-node X-Panel deployments.
    Administrator state-changing requests with an Origin or Referer header
    must come from a configured CORS origin (defense-in-depth CSRF check);
    non-browser Bearer clients may omit browser provenance headers.
servers:
  - url: http://localhost:8090/api
security:
  - bearerAuth: []
paths:
  /agent/v1/register:
    post:
      security: []
      summary: Register a node agent and issue a node token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
      parameters:
        - $ref: '#/components/parameters/AgentRegistrationToken'
      responses:
        '200': { description: Registration result }
  /agent/v1/bootstrap:
    post:
      security: []
      summary: Exchange a one-time installer token for a node credential
      description: The Ubuntu/Debian online installer consumes a short-lived single-use token generated by the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [install_token]
              properties:
                install_token: { type: string }
                hostname: { type: string }
                agent_version: { type: string }
      responses:
        '200': { description: Node credential issued }
        '401': { description: Installer token invalid, expired, or already used }
  /agent/v1/heartbeat:
    post:
      summary: Receive a node heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
      responses:
        '200': { description: Heartbeat accepted }
  /agent/v1/sync:
    post:
      summary: Receive an idempotent node snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSyncRequest'
      responses:
        '200': { description: Snapshot accepted }
  /auth/login:
    post:
      security: []
      summary: Administrator login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeLoginToken'
  /auth/refreshToken:
    post:
      security: []
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Refreshed token }
  /auth/me:
    get:
      summary: Current administrator
      responses:
        '200': { description: Current user }
  /auth/getUserInfo:
    get:
      summary: Frontend-compatible current administrator endpoint
      responses:
        '200': { description: Current user }
  /auth/logout:
    post:
      summary: Revoke current session
      responses:
        '200': { description: Logout result }
  /dashboard:
    get:
      summary: Operations overview
      description: >-
        Returns aggregate values together with generatedAt (query time) and
        dataAt (the newest successful Agent snapshot, or null when unavailable).
      responses:
        '200': { description: Dashboard summary }
  /users:
    get:
      summary: Inbound-based user list
      description: Every paginated response includes dataAt, the newest successful Agent snapshot time, or null when no snapshot exists.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200': { description: Paginated users }
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read a business user and its read-only X-Panel snapshots
      description: >-
        One relay Inbound represents one business user. Client / Email entries
        are device credentials and are not independently billable users.
      responses:
        '200':
          description: User detail, including Inbound, Client, node, and assigned-route snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserDetail'
        '404': { description: User not found }
    patch:
      summary: Update central-owned business fields of a user
      description: >-
        Only displayName, monthlyFee, currency, and notes are editable here.
        X-Panel-owned expiry, enable state, Clients, and traffic are never
        written back to X-Panel by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserDetail'
        '400': { description: Validation failed }
        '404': { description: User not found }
  /users/{id}/traffic:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: range
        in: query
        required: false
        description: Time window and aggregation granularity.
        schema: { type: string, enum: [1h, 6h, 1d, 7d], default: 1h }
    get:
      summary: Read a user's rate-based traffic trend
      description: >-
        Reads only the primary user Inbound on a relay node. Cumulative X-Panel
        snapshots are converted to upload/download deltas and rates; landing
        infrastructure Inbounds are excluded.
      responses:
        '200':
          description: Traffic trend points and summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserTrafficTrend'
        '400': { description: Invalid range }
        '404': { description: User not found }
  /users/{id}/route:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Assign a route template to a user
      description: >-
        Assigns one enabled reusable route to the user.  An optional routeExitIpId
        pins the user to a bound exit IP; omitting it uses the route's enabled
        weighted exit-IP pool.  This is central configuration and does not write
        X-Panel/Xray configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRouteRequest'
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserDetail'
        '400': { description: Validation failed }
        '404': { description: User or route not found }
        '409': { description: Route or exit IP is disabled }
    delete:
      summary: Clear the user's active route assignment
      description: Removes the active assignment while retaining its history.
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserDetail'
        '404': { description: User not found }
  /users/{id}/path-assets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List the path resources available to one business user
      description: >-
        The user's relay node is derived from its primary relay Inbound. The
        response includes landing nodes and their infrastructure Inbounds,
        relay-owned exit IPs, and independent S5 exit IPs. Landing Inbounds
        are path resources only and never business users.
      responses:
        '200':
          description: User path resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserPathAssets'
        '404': { description: User not found }
        '409': { description: User has no enabled relay primary Inbound }
  /users/{id}/path:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Assign a direct user network path
      description: >-
        The relay node is derived from the user's active primary Inbound. A
        relay-direct path uses a relay-owned exit IP; a landing path requires
        both an enabled landing node and one of its enabled infrastructure
        Inbounds; an external path uses an independent S5 exit IP. These
        modes are mutually exclusive and only central configuration changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserPathRequest'
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserDetail'
        '400': { description: Validation failed }
        '404': { description: User or exit IP not found }
        '409': { description: Node or exit IP is disabled or unavailable }
    delete:
      summary: Clear the user's active direct path
      description: Removes the active path while retaining its history.
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserDetail'
        '404': { description: User not found }
  /nodes:
    get:
      summary: Node list
      description: Every paginated response includes dataAt, the newest successful Agent snapshot time, or null when no snapshot exists.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/NodeType'
      responses:
        '200': { description: Paginated nodes }
    post:
      summary: Create a central node record and issue a one-time Agent token
      description: >-
        Creates central-owned node metadata. The X-Panel username and password
        stay on the node and are never accepted by this endpoint. The returned
        Agent token is shown only in this response; only its hash is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateRequest'
      responses:
        '200':
          description: Created node and one-time Agent token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNodeRegistration'
        '400': { description: Validation failed }
        '409': { description: Node key already exists }
  /nodes/{id}/install-token:
    post:
      summary: Issue a one-time online Agent installer token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Installer token issued }
        '404': { description: Node not found }
  /nodes/{id}:
    get:
      summary: Node detail with inbounds, exit IPs, sync runs and status history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNodeDetail'
        '404': { description: Node not found }
    patch:
      summary: Update node metadata or enable/disable a node
      description: Disabled nodes reject Agent heartbeat, sync, and on-demand synchronization requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePatchRequest'
      responses:
        '200': { description: Updated node summary }
        '400': { description: Validation failed }
        '404': { description: Node not found }
    delete:
      summary: Permanently delete a node
      description: >-
        Permanently deletes the node and all node-owned operational data in one
        transaction. Legacy route records, exit IP assets and direct user
        paths are removed with the node; business user records are retained.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Node and node-owned data deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNodeDeletion'
        '404': { description: Node not found }
  /nodes/{id}/sync:
    post:
      summary: Queue an on-demand node synchronization request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Synchronization request queued }
        '404': { description: Node not found }
        '409': { description: Node disabled }
  /nodes/{id}/costs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List temporal monthly cost records for a node
      responses:
        '200':
          description: Node cost records
          content:
            application/json:
              schema:
                type: object
                required: [code, msg, data]
                properties:
                  code: { type: string }
                  msg: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NodeCostRecord' }
        '404': { description: Node not found }
    post:
      summary: Add a temporal monthly cost record for a node
      description: Effective dates are central-owned and are used by monthly finance summaries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCostCreateRequest'
      responses:
        '200':
          description: Created node cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNodeCost'
        '400': { description: Validation failed }
        '404': { description: Node not found }
  /nodes/{id}/costs/{costId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: costId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Update node cost metadata
      description: Effective dates are immutable during update; create a new record when the effective range changes to preserve history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCostPatchRequest'
      responses:
        '200':
          description: Updated node cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNodeCost'
        '400': { description: Validation failed }
        '404': { description: Node or node cost not found }
        '409': { description: Effective dates cannot be changed on an existing record }
  /routes:
    get:
      summary: Route relationship list
      description: Every paginated response includes dataAt, the newest successful Agent snapshot time, or null when no snapshot exists.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
      responses:
        '200': { description: Paginated routes }
    post:
      summary: Create a route relationship
      description: Creates a route between a relay node and a landing node. If landingInboundId is provided, it must belong to the selected landing node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreateRequest'
      responses:
        '200':
          description: Created route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRouteDetail'
        '400': { description: Validation failed }
  /routes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read a route relationship
      responses:
        '200':
          description: Route detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRouteDetail'
        '404': { description: Route not found }
    patch:
      summary: Update a route relationship
      description: Fields omitted from the request retain their current values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePatchRequest'
      responses:
        '200':
          description: Updated route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRouteDetail'
        '400': { description: Validation failed }
        '404': { description: Route not found }
    delete:
      summary: Delete an unbound route relationship
      description: Deletion is rejected when the route has user or exit IP bindings; disable it instead.
      responses:
        '200': { description: Route deleted }
        '404': { description: Route not found }
        '409': { description: Route has active or historical bindings }
  /routes/{id}/exit-ips:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List exit IP bindings for a route
      responses:
        '200':
          description: Route exit IP bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  msg: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RouteExitIPBinding' }
        '404': { description: Route not found }
    post:
      summary: Bind an exit IP to a route
      description: Bind a node-owned exit on the relay/landing side or an independent S5 asset. The scope must match the asset source and the corresponding route node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExitIPBindRequest'
      responses:
        '200':
          description: Created route exit IP binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRouteExitIPBinding'
        '400': { description: Validation failed }
        '404': { description: Route or exit IP not found }
        '409': { description: Binding already exists }
  /routes/{id}/exit-ips/{exitIpId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: exitIpId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Update a route exit IP binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteExitIPUpdateRequest'
      responses:
        '200':
          description: Updated route exit IP binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeRouteExitIPBinding'
        '400': { description: Validation failed }
        '404': { description: Binding not found }
    delete:
      summary: Unbind an exit IP from a route
      responses:
        '200': { description: Binding removed }
        '404': { description: Binding not found }
  /exit-ips:
    get:
      summary: Exit IP asset list
      description: Every paginated response includes dataAt, the newest successful Agent snapshot time, or null when no snapshot exists.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
      responses:
        '200': { description: Paginated exit IPs }
    post:
      summary: Create an exit IP asset
      description: Creates an IPv4 or IPv6 asset. Use sourceType=node with ownerNodeId for a relay or landing node, or sourceType=s5 for an independent S5 asset. The legacy landingNodeId alias remains supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExitIPCreateRequest'
      responses:
        '200':
          description: Created exit IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeExitIPDetail'
        '400': { description: Validation failed }
        '409': { description: Duplicate IP for the same source }
  /exit-ips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read an exit IP asset
      responses:
        '200':
          description: Exit IP detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeExitIPDetail'
        '404': { description: Exit IP not found }
    patch:
      summary: Update an exit IP asset
      description: Fields omitted from the request retain their current values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExitIPPatchRequest'
      responses:
        '200':
          description: Updated exit IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeExitIPDetail'
        '400': { description: Validation failed }
        '404': { description: Exit IP not found }
        '409': { description: Duplicate IP for the same source }
    delete:
      summary: Delete an unbound exit IP asset
      description: Deletion is rejected when the asset is referenced by a route; disable it instead.
      responses:
        '200': { description: Exit IP deleted }
        '404': { description: Exit IP not found }
        '409': { description: Exit IP has route bindings }
  /costs/summary:
    get:
      summary: Monthly finance summary
      description: >-
        Includes temporal revenue, effective user count, cost totals and
        gross profit. A user is effective for a period when it was created
        before that month ended, had not expired at the month start, and was
        not disabled. The current operational status is not used for
        historical periods. Includes dataAt, the newest successful Agent
        snapshot time, or null when no snapshot exists.
      parameters:
        - name: period
          in: query
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '200':
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeFinanceSummary'
  /events:
    get:
      summary: Synchronization and anomaly events
      description: Every paginated response includes dataAt, the newest successful Agent snapshot time, or null when no snapshot exists.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Severity'
      responses:
        '200': { description: Paginated events }
  /health/live:
    get:
      security: []
      summary: Liveness check
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      security: []
      summary: Readiness check
      responses:
        '200': { description: Database is ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string }
    NodeId:
      name: node_id
      in: query
      schema: { type: string }
    NodeType:
      name: node_type
      in: query
      schema: { type: string, enum: [relay, landing, unknown] }
    Severity:
      name: severity
      in: query
      schema: { type: string, enum: [info, warning, error] }
    AgentRegistrationToken:
      name: X-Agent-Registration-Token
      in: header
      required: true
      schema: { type: string, format: password }
  schemas:
    LoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName: { type: string }
        password: { type: string, format: password }
    EnvelopeLoginToken:
      type: object
      properties:
        code: { type: string, example: '0000' }
        msg: { type: string, example: ok }
        data:
          type: object
          properties:
            token: { type: string }
            refreshToken: { type: string }
            expiresAt: { type: string, format: date-time }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        monthlyFee: { type: number, minimum: 0, maximum: 100000000 }
        currency:
          type: string
          description: CNY is currently the only supported reporting currency.
          enum: [CNY]
        notes: { type: string, maxLength: 2000 }
    AssignUserRouteRequest:
      type: object
      required: [routeId]
      additionalProperties: false
      properties:
        routeId: { type: string, minLength: 1 }
        routeExitIpId:
          type: [string, 'null']
          description: Route-exit binding ID; null selects the route's weighted exit-IP pool.
    AssignUserPathRequest:
      type: object
      required: [exitIpId]
      additionalProperties: false
      properties:
        landingNodeId: { type: [string, 'null'], description: Required together with landingInboundId for a landing path; null for relay-direct or external S5 }
        landingInboundId: { type: [string, 'null'], description: Required for a landing path and must be an enabled infrastructure inbound belonging to landingNodeId }
        exitIpId: { type: string, minLength: 1, description: Fixed exit IP asset ID }
        notes: { type: [string, 'null'], maxLength: 500 }
    NodeCreateRequest:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        nodeKey: { type: string, minLength: 1, maxLength: 120, description: Optional stable identifier; generated by the server when omitted }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [relay, landing] }
        hostname: { type: string, maxLength: 255 }
        managementUrl:
          type: string
          maxLength: 2048
          description: Full browser/X-Panel management URL, including scheme, port and optional panel base path
          pattern: '^https?://[^\\s]+$'
        publicIp: { type: string, maxLength: 100, description: Legacy compatibility field; use managementUrl for new nodes }
        exitIps:
          type: array
          maxItems: 100
          description: Optional node-owned IPv4/IPv6 addresses; each address becomes an exit IP asset.
          items: { type: string, description: IPv4 or IPv6 address }
        region: { type: string, maxLength: 120 }
        provider: { type: string, maxLength: 200 }
        panelBasePath: { type: string, minLength: 1, maxLength: 200, default: / }

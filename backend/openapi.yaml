openapi: 3.1.0
info:
  title: X-Panel Central API
  version: 0.1.0
  description: Central read model and operations API for multi-node X-Panel deployments.
servers:
  - url: http://127.0.0.1:8090/api
security:
  - bearerAuth: []
paths:
  /agent/v1/register:
    post:
      security: []
      summary: Register a node agent and issue a node token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
      parameters:
        - $ref: '#/components/parameters/AgentRegistrationToken'
      responses:
        '200': { description: Registration result }
  /agent/v1/heartbeat:
    post:
      summary: Receive a node heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
      responses:
        '200': { description: Heartbeat accepted }
  /agent/v1/sync:
    post:
      summary: Receive an idempotent node snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSyncRequest'
      responses:
        '200': { description: Snapshot accepted }
  /auth/login:
    post:
      security: []
      summary: Administrator login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeLoginToken'
  /auth/refreshToken:
    post:
      security: []
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Refreshed token }
  /auth/me:
    get:
      summary: Current administrator
      responses:
        '200': { description: Current user }
  /auth/getUserInfo:
    get:
      summary: Frontend-compatible current administrator endpoint
      responses:
        '200': { description: Current user }
  /auth/logout:
    post:
      summary: Revoke current session
      responses:
        '200': { description: Logout result }
  /dashboard:
    get:
      summary: Operations overview
      responses:
        '200': { description: Dashboard summary }
  /users:
    get:
      summary: Inbound-based user list
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200': { description: Paginated users }
  /nodes:
    get:
      summary: Node list
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/NodeType'
      responses:
        '200': { description: Paginated nodes }
  /routes:
    get:
      summary: Route relationship list
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
      responses:
        '200': { description: Paginated routes }
  /exit-ips:
    get:
      summary: Exit IP asset list
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
      responses:
        '200': { description: Paginated exit IPs }
  /costs/summary:
    get:
      summary: Monthly finance summary
      parameters:
        - name: period
          in: query
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '200': { description: Finance summary }
  /events:
    get:
      summary: Synchronization and anomaly events
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Severity'
      responses:
        '200': { description: Paginated events }
  /health/live:
    get:
      security: []
      summary: Liveness check
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      security: []
      summary: Readiness check
      responses:
        '200': { description: Database is ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string }
    NodeId:
      name: node_id
      in: query
      schema: { type: string }
    NodeType:
      name: node_type
      in: query
      schema: { type: string, enum: [relay, landing, unknown] }
    Severity:
      name: severity
      in: query
      schema: { type: string, enum: [info, warning, error] }
    AgentRegistrationToken:
      name: X-Agent-Registration-Token
      in: header
      required: true
      schema: { type: string, format: password }
  schemas:
    LoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName: { type: string }
        password: { type: string, format: password }
    EnvelopeLoginToken:
      type: object
      properties:
        code: { type: string, example: '0000' }
        msg: { type: string, example: ok }
        data:
          type: object
          properties:
            token: { type: string }
            refreshToken: { type: string }
            expiresAt: { type: string, format: date-time }
    AgentRegisterRequest:
      type: object
      required: [node_key, node_name]
      properties:
        node_key: { type: string }
        node_name: { type: string }
        node_type: { type: string, enum: [relay, landing, unknown] }
        hostname: { type: string }
        panel_base_path: { type: string }
        agent_version: { type: string }
        xpanel_version: { type: string }
        xray_version: { type: string }
    AgentStatus:
      type: object
      properties:
        xray_running: { type: boolean }
        xray_version: { type: string }
        xpanel_version: { type: string }
    AgentHeartbeatRequest:
      type: object
      required: [node_key, observed_at, status]
      properties:
        node_key: { type: string }
        observed_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AgentStatus' }
    AgentClient:
      type: object
      required: [remote_id]
      properties:
        remote_id: { type: string }
        email: { type: string }
        enable: { type: boolean }
        expiry_time: { type: integer, format: int64 }
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
        all_time: { type: integer, format: int64 }
        last_online: { type: integer, format: int64 }
    AgentInbound:
      type: object
      required: [remote_id]
      properties:
        remote_id: { type: integer, format: int64 }
        tag: { type: string }
        remark: { type: string }
        protocol: { type: string }
        port: { type: integer }
        listen: { type: string }
        enable: { type: boolean }
        expiry_time: { type: integer, format: int64 }
        up: { type: integer, format: int64 }
        down: { type: integer, format: int64 }
        all_time: { type: integer, format: int64 }
        config_hash: { type: string }
        clients:
          type: array
          items: { $ref: '#/components/schemas/AgentClient' }
    AgentSyncRequest:
      type: object
      required: [node_key, sync_id, observed_at, status, inbounds]
      properties:
        node_key: { type: string }
        sync_id: { type: string }
        observed_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AgentStatus' }
        inbounds:
          type: array
          items: { $ref: '#/components/schemas/AgentInbound' }
